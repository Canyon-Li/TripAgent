# TripAgent 一键启动（§11.3）
#   GIT_SHA=$(git rev-parse --short HEAD) docker compose up --build
#   web -> http://localhost:3000    api -> http://localhost:8000/docs
services:
  api:
    build:
      context: .
      args:
        # 构建时注入 git sha，/healthz 可追溯；未设置则为 unknown
        GIT_SHA: ${GIT_SHA:-unknown}
    env_file: .env          # LLM/路由等运行时配置；缺省回退 .env.example 默认值
    ports:
      - "8000:8000"
    volumes:
      # POI/矩阵数据集 + SQLite 持久化（WAL 文件同目录）
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  web:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
