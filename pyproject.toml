[project]
name = "tripagent"
version = "0.1.0"
description = "多约束行程 Agent 可靠性平台 —— FastAPI + OR-Tools + SQLite（见 project.md）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "ortools>=9.11",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "httpx>=0.28",
    "openai>=1.60",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "mypy>=1.14",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
# 生成的迁移脚本与 ruff 格式风格不一路（CI 口径本就不含该目录），全仓自查时排除
extend-exclude = ["alembic/versions"]

# 类型检查（CI typecheck job）：宽松起步——不强制注解全覆盖，只拦真实类型错误
# （2026-11-18 retro：心跳工厂签名 bug 本可被当场抓住，故接入）
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "ortools.*"
ignore_missing_imports = true
ignore_errors = true

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ 无 __init__.py，pytest 默认只把 tests/ 本身入 sys.path——
# `from tests.fakes import` 需要仓库根在 sys.path（CI 的裸 `pytest -q` 不含 cwd）；
# 本地 `python -m pytest` 因 cwd 注入一直掩盖了这一点
pythonpath = ["."]
