# web 容器配置：静态前端 + API 同源反代（ADR-005 Nginx 托管；免 CORS）
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 网关（FastAPI，compose 服务名 api）
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 探针与文档一并反代，3000 端口即可访问全部能力
    location ~ ^/(healthz|readyz|docs|redoc|openapi\.json)$ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }
}
