# web 容器配置：静态前端 + API 同源反代（ADR-005 Nginx 托管；免 CORS）
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 网关（FastAPI，compose 服务名 api）
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 探针、文档与只读 Agent Card（§7.7 A2A 风格发现入口）一并反代；
    # Host 用 $http_host 透传原始 host:port——Agent Card 的 url 由 request.base_url 生成
    location ~ ^/(healthz|readyz|docs|redoc|openapi\.json|\.well-known/agent\.json)$ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
    }
}
