<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-label="TripAgent 多约束行程 Agent 可靠性平台总体架构图">
  <title>TripAgent 总体架构</title>
  <desc>六层架构：接入层、API 层、Agent 运行时、基础设施四支柱、能力与数据层、外部依赖。基础设施四支柱分别对应携程 MJ036607 岗位职责二、三、四、五。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#7A8794" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: 'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Source Han Sans SC',sans-serif; }
      .ttl { font-size: 21px; font-weight: 600; fill: #1B2733; }
      .sub { font-size: 12px; fill: #5F6B7A; }
      .layer { font-size: 12px; font-weight: 600; fill: #5F6B7A; letter-spacing: 0.5px; }
      .bt { font-size: 14px; font-weight: 600; fill: #0C447C; }
      .bs { font-size: 11.5px; fill: #185FA5; }
      .nt { font-size: 12.5px; font-weight: 600; fill: #2C3E50; }
      .ns { font-size: 11.5px; fill: #5F6B7A; }
      .stepno { font-size: 11px; font-weight: 600; fill: #0F6E56; }
      .step { font-size: 12.5px; font-weight: 600; fill: #085041; }
      .steps { font-size: 11px; fill: #0F6E56; }
      .pt { font-size: 14px; font-weight: 600; fill: #3C3489; }
      .pb { font-size: 11.5px; fill: #534AB7; }
      .at { font-size: 12.5px; font-weight: 600; fill: #633806; }
      .as { font-size: 11px; fill: #854F0B; }
      .al { font-size: 11px; fill: #5F6B7A; }
      .badge { font-size: 11px; font-weight: 600; fill: #FFFFFF; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="780" fill="#FFFFFF"/>

  <text class="ttl" x="40" y="42">TripAgent · 多约束行程 Agent 可靠性平台</text>
  <text class="sub" x="40" y="66">业务 Agent + 四层基础设施　/　对齐携程 2027 届秋招 Agent 开发工程师（MJ036607）五条职责　/　架构图 v0.1</text>

  <line x1="884" y1="38" x2="906" y2="38" stroke="#7A8794" stroke-width="1.6"/>
  <text class="ns" x="912" y="38" dominant-baseline="central">同步主链路</text>
  <line x1="1010" y1="38" x2="1032" y2="38" stroke="#7A8794" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text class="ns" x="1038" y="38" dominant-baseline="central">观测 / 异步</text>
  <text class="ns" x="884" y="62">框内编号 = 对应 JD 职责；TBD 指标由评测脚本回填</text>

  <!-- 01 接入层 -->
  <rect x="40" y="90" width="1120" height="88" rx="14" fill="#F7F9FB" stroke="#DDE3EA" stroke-width="1"/>
  <text class="layer" x="56" y="108">01　接入层 · 静态前端（无构建依赖） · 职责① 上线证据</text>
  <rect x="60" y="118" width="340" height="50" rx="9" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text class="bt" x="76" y="138">行程对话视图</text>
  <text class="bs" x="76" y="156">SSE 流式输出 · 精确到分钟的行程卡</text>
  <rect x="420" y="118" width="340" height="50" rx="9" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text class="bt" x="436" y="138">Trace 回放视图</text>
  <text class="bs" x="436" y="156">按 trace_id 渲染 span 瀑布图</text>
  <rect x="780" y="118" width="340" height="50" rx="9" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text class="bt" x="796" y="138">评测看板</text>
  <text class="bs" x="796" y="156">指标趋势 · 改动前后回归对比</text>

  <path d="M600 178 L600 192" fill="none" stroke="#7A8794" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text class="al" x="612" y="185" dominant-baseline="central">HTTPS / SSE</text>

  <!-- 02 API 层 -->
  <rect x="40" y="194" width="1120" height="82" rx="14" fill="#F7F9FB" stroke="#DDE3EA" stroke-width="1"/>
  <text class="layer" x="56" y="212">02　API 层 · FastAPI 网关（统一 trace_id 与错误模型）</text>
  <rect x="60" y="222" width="1080" height="46" rx="9" fill="#EEF2F7" stroke="#8A97A6" stroke-width="1"/>
  <text class="nt" x="600" y="238" text-anchor="middle">POST /api/chat (SSE)　·　POST /api/plan　·　GET /api/runs/{trace_id}　·　POST /api/eval/run　·　GET /api/eval/reports</text>
  <text class="ns" x="600" y="257" text-anchor="middle">GET / POST /api/registry/capabilities　·　GET /api/registry/health　·　GET /healthz /readyz（含 version + git_sha）</text>

  <path d="M600 276 L600 290" fill="none" stroke="#7A8794" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 03 Agent 运行时 -->
  <rect x="40" y="292" width="1120" height="132" rx="14" fill="#F7F9FB" stroke="#DDE3EA" stroke-width="1"/>
  <text class="layer" x="56" y="310">03　Agent 运行时 · 单向主链路（职责 ①②）</text>

  <rect x="110" y="322" width="180" height="68" rx="9" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text class="stepno" x="124" y="340">01</text>
  <text class="step" x="124" y="358">意图解析</text>
  <text class="steps" x="124" y="376">LLM → PlanRequest</text>

  <rect x="310" y="322" width="180" height="68" rx="9" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text class="stepno" x="324" y="340">02</text>
  <text class="step" x="324" y="358">记忆检索</text>
  <text class="steps" x="324" y="376">注入硬约束对象</text>

  <rect x="510" y="322" width="180" height="68" rx="9" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text class="stepno" x="524" y="340">03</text>
  <text class="step" x="524" y="358">能力发现</text>
  <text class="steps" x="524" y="376">Registry 按版本路由</text>

  <rect x="710" y="322" width="180" height="68" rx="9" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text class="stepno" x="724" y="340">04</text>
  <text class="step" x="724" y="358">规划求解</text>
  <text class="steps" x="724" y="376">Routing + 距离矩阵</text>

  <rect x="910" y="322" width="180" height="68" rx="9" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text class="stepno" x="924" y="340">05</text>
  <text class="step" x="924" y="358">约束校验</text>
  <text class="steps" x="924" y="376">独立 Verifier → 应答</text>

  <path d="M292 356 L308 356" fill="none" stroke="#7A8794" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M492 356 L508 356" fill="none" stroke="#7A8794" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M692 356 L708 356" fill="none" stroke="#7A8794" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M892 356 L908 356" fill="none" stroke="#7A8794" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text class="al" x="110" y="408">LLM 只负责理解与解释；事实、时间线与预算由求解器和独立校验器保证（ADR-001 / ADR-002）</text>

  <path d="M300 424 L300 438" fill="none" stroke="#7A8794" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M600 424 L600 438" fill="none" stroke="#7A8794" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <path d="M900 424 L900 438" fill="none" stroke="#7A8794" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 04 基础设施层 -->
  <rect x="40" y="440" width="1120" height="150" rx="14" fill="#F7F9FB" stroke="#DDE3EA" stroke-width="1"/>
  <text class="layer" x="56" y="458">04　基础设施层 · 四支柱（实时主链路旁路接入，不侵入业务逻辑）</text>
  <text class="al" x="760" y="458">运行时 ↔ 支柱：记忆读写 / trace 上报 / 能力发现</text>

  <rect x="60" y="470" width="255" height="112" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <rect x="275" y="480" width="30" height="20" rx="10" fill="#534AB7"/>
  <text class="badge" x="290" y="490" text-anchor="middle" dominant-baseline="central">③</text>
  <text class="pt" x="74" y="496">Agent 记忆系统</text>
  <line x1="74" y1="506" x2="301" y2="506" stroke="#534AB7" stroke-width="0.6" opacity="0.45"/>
  <text class="pb" x="74" y="524">Raw Ledger / Views / Policy</text>
  <text class="pb" x="74" y="544">provenance · scope · 衰减</text>
  <text class="pb" x="74" y="564">一致性：结构化约束注入</text>

  <rect x="335" y="470" width="255" height="112" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <rect x="550" y="480" width="30" height="20" rx="10" fill="#534AB7"/>
  <text class="badge" x="565" y="490" text-anchor="middle" dominant-baseline="central">④</text>
  <text class="pt" x="349" y="496">评测与观测</text>
  <line x1="349" y1="506" x2="576" y2="506" stroke="#534AB7" stroke-width="0.6" opacity="0.45"/>
  <text class="pb" x="349" y="524">40 条断言式评测集</text>
  <text class="pb" x="349" y="544">Trace Store + 指标看板</text>
  <text class="pb" x="349" y="564">CI 回归报告与坏例回流</text>

  <rect x="610" y="470" width="255" height="112" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <rect x="825" y="480" width="30" height="20" rx="10" fill="#534AB7"/>
  <text class="badge" x="840" y="490" text-anchor="middle" dominant-baseline="central">⑤</text>
  <text class="pt" x="624" y="496">注册与发现</text>
  <line x1="624" y1="506" x2="851" y2="506" stroke="#534AB7" stroke-width="0.6" opacity="0.45"/>
  <text class="pb" x="624" y="524">Capability card + 版本</text>
  <text class="pb" x="624" y="544">心跳摘除 · 权重灰度</text>
  <text class="pb" x="624" y="564">回滚无需重启</text>

  <rect x="885" y="470" width="255" height="112" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <rect x="1100" y="480" width="30" height="20" rx="10" fill="#534AB7"/>
  <text class="badge" x="1115" y="490" text-anchor="middle" dominant-baseline="central">②</text>
  <text class="pt" x="899" y="496">框架稳定性</text>
  <line x1="899" y1="506" x2="1126" y2="506" stroke="#534AB7" stroke-width="0.6" opacity="0.45"/>
  <text class="pb" x="899" y="524">可插拔组件 + 依赖注入</text>
  <text class="pb" x="899" y="544">超时重试 · 幂等 · 降级</text>
  <text class="pb" x="899" y="564">LLM 适配器可配置替换</text>

  <path d="M600 590 L600 604" fill="none" stroke="#7A8794" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 05 能力与数据层 -->
  <rect x="40" y="606" width="1120" height="90" rx="14" fill="#F7F9FB" stroke="#DDE3EA" stroke-width="1"/>
  <text class="layer" x="56" y="624">05　能力与数据层（支柱通过本层落地）</text>

  <rect x="60" y="634" width="255" height="50" rx="9" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text class="at" x="74" y="653">OR-Tools Routing 求解器</text>
  <text class="as" x="74" y="671">时间窗 · 预算 · drop penalty</text>

  <rect x="335" y="634" width="255" height="50" rx="9" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text class="at" x="349" y="653">距离矩阵服务</text>
  <text class="as" x="349" y="671">OSRM / 高德 / 预计算缓存</text>

  <rect x="610" y="634" width="255" height="50" rx="9" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text class="at" x="624" y="653">SQLite (WAL)</text>
  <text class="as" x="624" y="671">Ledger · POI · Eval · Registry</text>

  <rect x="885" y="634" width="255" height="50" rx="9" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text class="at" x="899" y="653">LLM 适配器</text>
  <text class="as" x="899" y="671">OpenAI-compatible · 可替换</text>

  <path d="M600 696 L600 710" fill="none" stroke="#7A8794" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- 06 外部依赖 -->
  <rect x="40" y="712" width="1120" height="42" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
  <text class="ns" x="600" y="733" text-anchor="middle" dominant-baseline="central">外部依赖：LLM 供应商　·　OSRM / 高德距离矩阵　·　Docker Compose 自托管　·　GitHub Actions（pytest + eval 回归，指标退化阻断合并）</text>

  <text class="al" x="40" y="770">所有 TBD 指标由评测脚本回填 · 指标定义与验收见 project.md §12 · 状态：Draft v0.1.0</text>
  <text class="al" x="1160" y="770" text-anchor="end">architecture.svg</text>
</svg>
